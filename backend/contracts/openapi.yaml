openapi: 3.1.0
info:
  title: AI QA Platform API
  version: 0.1.0
servers:
  - url: http://localhost:3000/api
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy

  /projects:
    get:
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      summary: Get project by id
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    patch:
      summary: Update project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    delete:
      summary: Delete project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Deleted project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Project not found

  /projects/{projectId}/artifacts:
    post:
      summary: Create/upload an input artifact
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtifactRequest"
      responses:
        "201":
          description: Artifact created
    get:
      summary: List project artifacts
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsProjectId"
      responses:
        "200":
          description: Artifact list

  /artifacts/{id}/parse:
    post:
      summary: Queue artifact parsing
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Parse workflow queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"

  /projects/{projectId}/requirements/analyze:
    post:
      summary: Queue requirement analysis
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequirementRequest"
      responses:
        "202":
          description: Analyze workflow queued

  /requirements/versions/{id}:
    get:
      summary: Get requirement version
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Requirement version detail

  /requirements/versions/{id}/items:
    patch:
      summary: Replace requirement items for a version
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/RequirementItem"
      responses:
        "200":
          description: Requirement items updated

  /requirements/versions/{id}/quality:
    post:
      summary: Queue requirement quality check
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Quality workflow queued

  /requirements/versions/{id}/gaps:
    post:
      summary: Queue gap detection
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Gap detection workflow queued
    get:
      summary: List gaps for requirement version
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Gap list

  /gaps/{id}:
    patch:
      summary: Update gap status or resolution note
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGapRequest"
      responses:
        "200":
          description: Gap updated

  /requirements/versions/{id}/rewrite:
    post:
      summary: Queue requirement rewrite
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Rewrite workflow queued

  /requirements/versions/{id}/approve:
    post:
      summary: Approve requirement version
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: Requirement approved or approved with override warning

  /requirements/versions/{id}/testcase-sets:
    post:
      summary: Queue testcase generation
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTestcasesRequest"
      responses:
        "202":
          description: Testcase generation workflow queued

  /testcase-sets/{id}:
    get:
      summary: Get testcase set
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Testcase set detail

  /test-cases/{id}:
    patch:
      summary: Update one testcase
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestCaseRequest"
      responses:
        "200":
          description: Testcase updated

  /testcase-sets/{id}/coverage:
    post:
      summary: Queue coverage check
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Coverage workflow queued
    get:
      summary: Get coverage matrix for testcase set
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Coverage matrix

  /testcase-sets/{id}/exports/excel:
    post:
      summary: Queue Excel export
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Export workflow queued

  /projects/{projectId}/exports:
    get:
      summary: List export artifacts
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsProjectId"
      responses:
        "200":
          description: Export history

  /exports/{id}/download:
    get:
      summary: Download export artifact
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "302":
          description: Redirect to signed download URL

  /workflow-runs/{id}:
    get:
      summary: Get workflow status
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Workflow status

  /workflow-runs/{id}/retry:
    post:
      summary: Retry failed workflow
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Retry queued

  /workflow-runs/{id}/cancel:
    post:
      summary: Cancel workflow
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Workflow canceled

  /projects/{projectId}/ai-call-logs:
    get:
      summary: List AI call logs
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsProjectId"
      responses:
        "200":
          description: AI call logs

  /projects/{projectId}/audit-logs:
    get:
      summary: List audit logs
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsProjectId"
      responses:
        "200":
          description: Audit logs

  /configs/ai-providers/{id}/test-connection:
    post:
      summary: Test AI provider connection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic]
      responses:
        "200":
          description: Provider connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAiProviderConnectionResponse"
        "401":
          description: Provider secret is invalid
        "404":
          description: Provider or secret is not configured

  /configs/prompt-versions:
    post:
      summary: Create a prompt version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptVersionRequest"
      responses:
        "201":
          description: Prompt version created
    get:
      summary: List prompt versions
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Prompt versions

  /configs/prompt-versions/{id}:
    get:
      summary: Get prompt version
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Prompt version detail
        "404":
          description: Prompt version not found

  /configs/prompt-versions/{id}/activate:
    post:
      summary: Activate prompt version
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Prompt version activated

  /projects/{projectId}/configs/gate:
    post:
      summary: Upsert quality gate config
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGateConfigRequest"
      responses:
        "201":
          description: Gate config created or updated
    get:
      summary: Get quality gate config
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsProjectId"
      responses:
        "200":
          description: Gate config

  /projects/{projectId}/configs/budget:
    post:
      summary: Upsert budget config
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBudgetConfigRequest"
      responses:
        "201":
          description: Budget config created or updated

  /audit-logs:
    get:
      summary: List audit logs
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit logs

  /projects/{projectId}/cost-summary:
    get:
      summary: Get AI cost summary
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsProjectId"
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
      responses:
        "200":
          description: Cost summary

  /projects/{projectId}/budget-status:
    get:
      summary: Get budget status
      parameters:
        - $ref: "#/components/parameters/ProjectIdAsProjectId"
      responses:
        "200":
          description: Budget status

  /skills/figma-reader:
    post:
      summary: Read Figma file metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadFigmaRequest"
      responses:
        "200":
          description: Figma reader result

  /skills/test-call:
    post:
      summary: Test skill call with fallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestSkillRequest"
      responses:
        "200":
          description: Skill call result
        "403":
          description: Skill test calls disabled

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProjectIdAsProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Project:
      type: object
      required: [id, name, status, defaultLanguage, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        defaultLanguage:
          type: string
          enum: [vi, en]
        configOverrides:
          type: [object, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        defaultLanguage:
          type: string
          enum: [vi, en]
          default: vi
        configOverrides:
          type: object
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        defaultLanguage:
          type: string
          enum: [vi, en]
        configOverrides:
          type: object
    DeleteResponse:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
        id:
          type: string
    CreateArtifactRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [DOCUMENT, SPREADSHEET, IMAGE, TEXT, FIGMA]
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        storageKey:
          type: string
        sourceText:
          type: string
        parsedContent:
          type: object
    AnalyzeRequirementRequest:
      type: object
      required: [artifactId]
      properties:
        artifactId:
          type: string
        language:
          type: string
          enum: [vi, en]
    RequirementItem:
      type: object
      required: [externalId, module, feature, type, priority, testable, content]
      properties:
        externalId:
          type: string
        module:
          type: string
        feature:
          type: string
        type:
          type: string
        priority:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW]
        testable:
          type: boolean
        content:
          type: string
        metadata:
          type: object
    UpdateGapRequest:
      type: object
      properties:
        status:
          type: string
          enum: [OPEN, RESOLVED, ACCEPTED_RISK, REJECTED]
        resolutionNote:
          type: string
    ApproveRequest:
      type: object
      properties:
        override:
          type: boolean
          default: false
        reason:
          type: string
    GenerateTestcasesRequest:
      type: object
      properties:
        language:
          type: string
          enum: [vi, en]
        scope:
          type: string
        detailLevel:
          type: string
          enum: [smoke, standard, exhaustive]
        maxCases:
          type: integer
          minimum: 1
    UpdateTestCaseRequest:
      type: object
      properties:
        title:
          type: string
        preconditions:
          type: string
        steps:
          type: array
          items:
            type: string
        expectedResult:
          type: string
        priority:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW]
        status:
          type: string
          enum: [DRAFT, READY, APPROVED, REJECTED, NEEDS_REVIEW]
    WorkflowRun:
      type: object
      required: [id, projectId, traceId, workflowKey, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        traceId:
          type: string
        workflowKey:
          type: string
        status:
          type: string
          enum: [QUEUED, RUNNING, WAITING_USER, SUCCEEDED, FAILED, CANCELED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TestAiProviderConnectionResponse:
      type: object
      required: [ok, provider, models, secretRef]
      properties:
        ok:
          type: boolean
        provider:
          type: string
        models:
          type: array
          items:
            type: string
        secretRef:
          type: [string, "null"]
    CreatePromptVersionRequest:
      type: object
      required: [name, content]
      properties:
        name:
          type: string
        content:
          type: string
        variables:
          type: object
        notes:
          type: string
    UpdateGateConfigRequest:
      type: object
      properties:
        minQualityScore:
          type: integer
          minimum: 0
        blockIfOpenGaps:
          type: boolean
    UpdateBudgetConfigRequest:
      type: object
      properties:
        hardLimitUsd:
          type: integer
          minimum: 0
        warnAtPercent:
          type: integer
          minimum: 1
    ReadFigmaRequest:
      type: object
      required: [fileKey]
      properties:
        fileKey:
          type: string
        nodeIds:
          type: string
        accessToken:
          type: string
    TestSkillRequest:
      type: object
      required: [provider, model, prompt]
      properties:
        provider:
          type: string
          enum: [openai, anthropic]
        model:
          type: string
        prompt:
          type: string
        fallbackProvider:
          type: string
          enum: [openai, anthropic]
        fallbackModel:
          type: string
        projectId:
          type: string
        skillName:
          type: string
        promptVersion:
          type: string
